name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: ${{ secrets.DB_USERNAME || 'taskmanager' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'taskmanager' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean install
        env:
          DB_URL: jdbc:postgresql://localhost:5432/taskmanager
          DB_DRIVER: org.postgresql.Driver
          DB_USERNAME: ${{ secrets.DB_USERNAME || 'taskmanager' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'taskmanager' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dGVzdC1vbmx5LWtleS1mb3ItY2ktdXNlLW9ubHktMzItYnl0ZXM=' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
