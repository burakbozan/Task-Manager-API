spring.application.name=task-manager-api
spring.datasource.url=${DB_URL:jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Task Manager API
info.app.description=REST API for managing tasks
info.app.version=v1

logging.level.root=INFO
logging.level.com.example.taskmanager=INFO

#---
spring.config.activate.on-profile=dev
logging.level.com.example.taskmanager=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

#---
spring.config.activate.on-profile=prod
logging.level.root=INFO
logging.level.com.example.taskmanager=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
